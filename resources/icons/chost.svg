<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3038"/>
      <stop offset="1" stop-color="#14161a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc35a"/>
      <stop offset="1" stop-color="#f0742a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dde3"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="53.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- the C: a ring open to the right, where the sound comes out -->
  <path d="M 178.6 77.4 A 72 72 0 1 0 178.6 178.6" fill="none" stroke="url(#ring)" stroke-width="26" stroke-linecap="round"/>
  <!-- a waveform inside -->
  <g fill="url(#bar)">
    <rect x="81"  y="108" width="16" height="40"  rx="8"/>
    <rect x="105" y="84"  width="16" height="88"  rx="8"/>
    <rect x="129" y="98"  width="16" height="60"  rx="8"/>
    <rect x="153" y="114" width="16" height="28"  rx="8"/>
  </g>
</svg>
