<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRODUCER FM-01X · Hi-Fi 模拟磁带播放器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin 3.5s linear infinite;
    }
    .vu-glass {
      background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.05) 50%, rgba(0,0,0,0.1) 100%);
    }
    .metal-shadow {
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 2px 1px rgba(255, 255, 255, 0.2) inset;
    }
    .led-text {
      text-shadow: 0 0 12px rgba(239, 68, 68, 0.7), 0 0 2px rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body class="bg-[#121316] min-h-screen flex items-center justify-center p-4 font-mono select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEMO_TRACKS = [
      { id: "52132592-72d7-48e9-993b-ff52acb300b6", title: "high tide", artist: "cob", url: "https://storage.googleapis.com/producer-app-public/clips/52132592-72d7-48e9-993b-ff52acb300b6.m4a" },
      { id: "971c3e8f-04b4-4d2b-a782-16da26d689b3", title: "anyway bye", artist: "greyplains", url: "https://storage.googleapis.com/producer-app-public/clips/971c3e8f-04b4-4d2b-a782-16da26d689b3.m4a" },
      { id: "025d57b2-a0e7-4b04-bc55-b3d07cb085b8", title: "manhattan", artist: "haightstreetcds", url: "https://storage.googleapis.com/producer-app-public/clips/025d57b2-a0e7-4b04-bc55-b3d07cb085b8.m4a" },
      { id: "fe7a5767-c051-4788-b224-706b91550037", title: "fórmula uno", artist: "greyplains", url: "https://storage.googleapis.com/producer-app-public/clips/fe7a5767-c051-4788-b224-706b91550037.m4a" },
      { id: "cc2d0666-691f-42bb-bf57-3f5f3f83b889", title: "MOSAIC", artist: "hayk", url: "https://storage.googleapis.com/producer-app-public/clips/cc2d0666-691f-42bb-bf57-3f5f3f83b889.m4a" },
      { id: "752d201b-b280-4533-89ce-fe1d0a1bb9bd", title: "We Are The Night", artist: "East.End.DAN", url: "https://storage.googleapis.com/producer-app-public/clips/752d201b-b280-4533-89ce-fe1d0a1bb9bd.m4a" }
    ];

    // SVG Icons
    const PlayIcon = () => (
      <svg className="w-8 h-8 fill-current ml-1" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    );
    const PauseIcon = () => (
      <svg className="w-8 h-8 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    );
    const StopIcon = () => (
      <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
    );
    const RewindIcon = () => (
      <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
    );
    const FastForwardIcon = () => (
      <svg className="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
    );
    const FolderIcon = () => (
      <svg className="w-4 h-4 fill-current mr-1" viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
    );

    // Reel Component with realistic mechanical Spokes
    const TapeReel = ({ isPlaying, reverse = false }) => (
      <div className={`relative w-36 h-36 rounded-full border-4 border-zinc-800 bg-gradient-to-br from-zinc-950 to-zinc-900 flex items-center justify-center shadow-[0_4px_15px_rgba(0,0,0,0.8)] ${isPlaying ? 'animate-spin-slow' : ''}`}
           style={{ animationDirection: reverse ? 'reverse' : 'normal' }}>
        <div className="absolute inset-0 rounded-full border-[14px] border-zinc-800/40" />
        <div className="absolute w-24 h-24 rounded-full border-2 border-dashed border-zinc-700/50" />
        <div className="w-6 h-6 bg-gradient-to-b from-zinc-500 to-zinc-700 rounded-full z-20 shadow-lg border border-zinc-400 flex items-center justify-center">
          <div className="w-2 h-2 bg-zinc-900 rounded-full" />
        </div>
        {[0, 60, 120, 180, 240, 300].map((deg) => (
          <div 
            key={deg} 
            className="absolute w-1.5 h-14 bg-gradient-to-b from-zinc-600 via-zinc-400 to-zinc-700 rounded-full" 
            style={{ transform: `rotate(${deg}deg) translateY(-26px)` }}
          />
        ))}
      </div>
    );

    // VU Meter with realistic audio-reactive needle & retro warm backlight
    const VUMeter = ({ isPlaying, audioLevel = 0 }) => {
      const [needleAngle, setNeedleAngle] = useState(-42);

      useEffect(() => {
        if (!isPlaying) {
          setNeedleAngle(-42);
          return;
        }
        // Map audio level (0-1) to meter angle (-42 deg to +38 deg)
        const target = -42 + Math.min(1.0, audioLevel * 1.35) * 75 + (Math.random() * 4 - 2);
        setNeedleAngle(prev => prev + (target - prev) * 0.45);
      }, [isPlaying, audioLevel]);

      return (
        <div className="relative w-36 h-24 bg-gradient-to-b from-[#f2efe6] to-[#dfdacb] rounded-t-full border-2 border-zinc-600 overflow-hidden shadow-[inset_0_2px_8px_rgba(0,0,0,0.4)]">
          {/* Subtle Warm Glow Lamp */}
          <div className="absolute inset-0 bg-amber-400/10 pointer-events-none" />
          
          {/* Dial Scale */}
          <div className="absolute inset-0 flex flex-col items-center pt-2">
            <div className="w-24 border-b border-zinc-500/80 mb-1" />
            <div className="text-[7px] font-black text-zinc-700 flex justify-between w-24 px-1 uppercase tracking-tighter">
              <span>-20</span><span>-10</span><span>-5</span><span>0</span><span className="text-red-600 font-extrabold">+3</span>
            </div>
          </div>

          {/* Needle */}
          <div 
            className="absolute bottom-0 left-1/2 w-0.5 h-20 bg-red-600 origin-bottom transition-transform duration-75 shadow-[0_0_2px_rgba(0,0,0,0.5)]"
            style={{ transform: `translateX(-50%) rotate(${needleAngle}deg)` }}
          />

          {/* Needle Pivot Cap */}
          <div className="absolute bottom-[-6px] left-1/2 -translate-x-1/2 w-5 h-5 bg-gradient-to-b from-zinc-700 to-zinc-950 rounded-full border border-zinc-500 z-10 shadow-md" />
          <div className="absolute bottom-2 left-1/2 -translate-x-1/2 text-[9px] font-black text-zinc-500 uppercase tracking-widest">VU</div>
          <div className="absolute inset-0 vu-glass pointer-events-none" />
        </div>
      );
    };

    function App() {
      const [tracks, setTracks] = useState(DEMO_TRACKS);
      const [currentSong, setCurrentSong] = useState(DEMO_TRACKS[0]);
      const [isPlaying, setIsPlaying] = useState(false);
      const [currentTime, setCurrentTime] = useState(0);
      const [duration, setDuration] = useState(0);
      const [audioLevel, setAudioLevel] = useState(0);

      const audioRef = useRef(null);
      const fileInputRef = useRef(null);
      const audioCtxRef = useRef(null);
      const analyserRef = useRef(null);
      const rafRef = useRef(null);

      // Setup Web Audio API for real VU meter response
      const setupWebAudio = () => {
        if (!audioRef.current || audioCtxRef.current) return;
        try {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioContext();
          const analyser = ctx.createAnalyser();
          analyser.fftSize = 256;
          const source = ctx.createMediaElementSource(audioRef.current);
          source.connect(analyser);
          analyser.connect(ctx.destination);
          audioCtxRef.current = ctx;
          analyserRef.current = analyser;
        } catch (e) {
          console.warn("AudioContext setup error:", e);
        }
      };

      const updateMeter = () => {
        if (analyserRef.current && isPlaying) {
          const data = new Uint8Array(analyserRef.current.frequencyBinCount);
          analyserRef.current.getByteFrequencyData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) {
            sum += data[i];
          }
          const avg = (sum / data.length) / 255.0;
          setAudioLevel(avg);
        } else if (isPlaying) {
          setAudioLevel(0.4 + Math.random() * 0.4);
        } else {
          setAudioLevel(0);
        }
        rafRef.current = requestAnimationFrame(updateMeter);
      };

      useEffect(() => {
        rafRef.current = requestAnimationFrame(updateMeter);
        return () => cancelAnimationFrame(rafRef.current);
      }, [isPlaying]);

      const togglePlay = () => {
        setupWebAudio();
        if (audioCtxRef.current && audioCtxRef.current.state === 'suspended') {
          audioCtxRef.current.resume();
        }
        if (audioRef.current) {
          if (isPlaying) {
            audioRef.current.pause();
            setIsPlaying(false);
          } else {
            audioRef.current.play().then(() => setIsPlaying(true)).catch(e => {
              console.log("Playback error:", e);
            });
          }
        }
      };

      const handleSongChange = (id) => {
        const song = tracks.find(s => s.id === id);
        if (song) {
          setCurrentSong(song);
          setIsPlaying(false);
          setTimeout(() => {
            if (audioRef.current) {
              audioRef.current.load();
              audioRef.current.play().then(() => setIsPlaying(true)).catch(() => {});
            }
          }, 50);
        }
      };

      // Support dropping local songs / desktop masters
      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const localUrl = URL.createObjectURL(file);
          const newTrack = {
            id: "local_" + Date.now(),
            title: file.name.replace(/\.[^/.]+$/, ""),
            artist: "本地顶级母带音频",
            url: localUrl
          };
          setTracks([newTrack, ...tracks]);
          setCurrentSong(newTrack);
          setIsPlaying(false);
          setTimeout(() => {
            if (audioRef.current) {
              audioRef.current.load();
              audioRef.current.play().then(() => setIsPlaying(true)).catch(() => {});
            }
          }, 100);
        }
      };

      return (
        <div className="w-full max-w-2xl bg-gradient-to-b from-zinc-300 via-zinc-200 to-zinc-400 rounded-2xl p-1.5 metal-shadow border-t border-white/60">
          <audio 
            ref={audioRef} 
            src={currentSong.url} 
            crossOrigin="anonymous" 
            onTimeUpdate={() => {
              if (audioRef.current) {
                setCurrentTime(audioRef.current.currentTime);
                setDuration(audioRef.current.duration || 0);
              }
            }}
            onEnded={() => setIsPlaying(false)}
          />

          <input 
            type="file" 
            ref={fileInputRef} 
            onChange={handleFileUpload} 
            accept="audio/*" 
            className="hidden" 
          />

          {/* Brushed Aluminum Chassis */}
          <div className="bg-gradient-to-br from-zinc-200 via-zinc-100 to-zinc-300 rounded-xl p-7 border-t border-white relative shadow-inner">
            
            {/* Top Reel & Meter Bay */}
            <div className="bg-[#181a1e] rounded-2xl p-6 mb-7 border-2 border-zinc-700/60 shadow-[inset_0_4px_20px_rgba(0,0,0,0.9)]">
              
              {/* Tape Reels + Center LED Counter */}
              <div className="flex justify-between items-center mb-6 px-2">
                <TapeReel isPlaying={isPlaying} />

                {/* Digital Counter Display */}
                <div className="flex flex-col items-center gap-3">
                  <div className="bg-[#1c0808] border-2 border-red-950/80 px-5 py-2.5 rounded-lg text-red-500 font-extrabold text-3xl tracking-widest led-text italic shadow-[0_0_25px_rgba(239,68,68,0.25)]">
                    {Math.floor(currentTime / 60).toString().padStart(2, '0')}:{Math.floor(currentTime % 60).toString().padStart(2, '0')}
                  </div>
                  <div className="w-28 h-2 bg-zinc-950 rounded-full overflow-hidden border border-zinc-800">
                    <div 
                      className="h-full bg-red-600 shadow-[0_0_12px_rgba(239,68,68,0.8)] transition-all duration-300"
                      style={{ width: `${duration ? (currentTime / duration) * 100 : 0}%` }}
                    />
                  </div>
                </div>

                <TapeReel isPlaying={isPlaying} reverse={true} />
              </div>

              {/* Dual VU Meters */}
              <div className="flex justify-center gap-10 border-t border-zinc-800/80 pt-5">
                <div className="flex flex-col items-center gap-1.5">
                  <VUMeter isPlaying={isPlaying} audioLevel={audioLevel * 1.05} />
                  <span className="text-[9px] font-black text-zinc-500 uppercase tracking-wider">LEFT CHANNEL</span>
                </div>
                <div className="flex flex-col items-center gap-1.5">
                  <VUMeter isPlaying={isPlaying} audioLevel={audioLevel * 0.95} />
                  <span className="text-[9px] font-black text-zinc-500 uppercase tracking-wider">RIGHT CHANNEL</span>
                </div>
              </div>
            </div>

            {/* Middle Track Info & Dropdown */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-5 mb-7">
              <div className="bg-gradient-to-b from-zinc-950 to-black p-4 rounded-xl border border-zinc-700/50 shadow-inner flex flex-col justify-center">
                <div className="text-[9px] text-zinc-500 tracking-[0.3em] uppercase font-bold mb-1">SIGNAL PROCESS</div>
                <div className="text-white font-black text-lg tracking-tight uppercase truncate">
                  {currentSong.title}
                </div>
                <div className="text-zinc-400 text-[10px] tracking-widest uppercase truncate mt-0.5">
                  ARTIST REF: {currentSong.artist}
                </div>
              </div>

              <div className="flex flex-col gap-2">
                <select 
                  className="w-full bg-gradient-to-b from-zinc-100 to-zinc-300 border-2 border-zinc-400 text-zinc-900 font-bold rounded-xl px-4 py-3 shadow-md focus:outline-none focus:ring-2 focus:ring-orange-400 transition-all cursor-pointer text-xs uppercase"
                  onChange={(e) => handleSongChange(e.target.value)}
                  value={currentSong.id}
                >
                  {tracks.map(song => (
                    <option key={song.id} value={song.id}>{song.title} - {song.artist}</option>
                  ))}
                </select>

                <button 
                  onClick={() => fileInputRef.current && fileInputRef.current.click()}
                  className="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-bold py-2 px-3 rounded-lg border border-zinc-600 transition flex items-center justify-center shadow"
                >
                  <FolderIcon /> 载入本地音频 / 桌面母带 WAV
                </button>
              </div>
            </div>

            {/* Physical Mechanical Transport Controls */}
            <div className="bg-gradient-to-b from-zinc-400/25 to-zinc-600/20 p-5 rounded-2xl border border-white/40 flex items-center justify-center gap-5 shadow-lg">
              <button 
                onClick={() => { if (audioRef.current) audioRef.current.currentTime = Math.max(0, currentTime - 10); }}
                className="w-14 h-14 bg-gradient-to-b from-zinc-50 to-zinc-300 rounded-xl shadow-[0_5px_0_rgb(113,113,122)] active:translate-y-1 active:shadow-none transition-all flex items-center justify-center text-zinc-800 hover:from-white border-t border-white"
                title="快退 10 秒"
              >
                <RewindIcon />
              </button>

              <button 
                onClick={() => {}}
                className="w-14 h-14 bg-gradient-to-b from-zinc-50 to-zinc-300 rounded-xl shadow-[0_5px_0_rgb(113,113,122)] active:translate-y-1 active:shadow-none transition-all flex items-center justify-center hover:from-white border-t border-white"
                title="录音指示"
              >
                <div className="w-4 h-4 bg-red-600 rounded-full shadow-[0_0_8px_rgba(220,38,38,0.7)]" />
              </button>

              {/* Big Main Play/Pause Button */}
              <button 
                onClick={togglePlay}
                className={`w-24 h-16 rounded-2xl shadow-[0_6px_0_rgb(154,52,18)] active:translate-y-1 active:shadow-none transition-all flex items-center justify-center border-t-2 border-white/40 ${isPlaying ? 'bg-gradient-to-b from-orange-400 to-orange-600 text-white' : 'bg-gradient-to-b from-zinc-50 to-zinc-300 text-zinc-900 shadow-[0_6px_0_rgb(113,113,122)] hover:from-white'}`}
                title="播放 / 暂停"
              >
                {isPlaying ? <PauseIcon /> : <PlayIcon />}
              </button>

              <button 
                onClick={() => {
                  if (audioRef.current) {
                    audioRef.current.pause();
                    audioRef.current.currentTime = 0;
                    setIsPlaying(false);
                  }
                }}
                className="w-16 h-14 bg-gradient-to-b from-zinc-50 to-zinc-300 rounded-xl shadow-[0_5px_0_rgb(113,113,122)] active:translate-y-1 active:shadow-none transition-all flex items-center justify-center text-zinc-800 hover:from-white border-t border-white"
                title="停止"
              >
                <StopIcon />
              </button>

              <button 
                onClick={() => { if (audioRef.current) audioRef.current.currentTime = Math.min(duration, currentTime + 10); }}
                className="w-14 h-14 bg-gradient-to-b from-zinc-50 to-zinc-300 rounded-xl shadow-[0_5px_0_rgb(113,113,122)] active:translate-y-1 active:shadow-none transition-all flex items-center justify-center text-zinc-800 hover:from-white border-t border-white"
                title="快进 10 秒"
              >
                <FastForwardIcon />
              </button>
            </div>

            {/* Brand Logo & Precision Stamp */}
            <div className="mt-8 flex justify-between items-end px-1">
              <div>
                <div className="text-2xl font-black italic tracking-tighter text-zinc-800/80">PRODUCER</div>
                <div className="text-[9px] tracking-[0.5em] font-bold uppercase text-zinc-600">ALUMINUM SERIES · FM-01X</div>
              </div>
              <div className="text-[10px] text-right font-bold text-zinc-600 leading-tight">
                PRECISION AUDIO<br/>HI-FIDELITY METAL CASSETTE
              </div>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
